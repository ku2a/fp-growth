[project]
name = "asociacion"
version = "0.1.0"
description = "Association rule mining (Apriori, FP-Growth, ECLAT) on The Bread Basket dataset"
readme = "README.md"
authors = [
    { name = "Pablo", email = "pablo.suarez@futurton.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyter-collaboration>=5.0.4",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xlrd>=2.0.2",
]

[project.scripts]
asociacion = "asociacion:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab-lsp>=5.3.0",
    "python-lsp-server[all]>=1.15.0",
]
